name: Cat Heaven CI/CD

# Pipeline:
#   every push / PR      -> unit tests, debug APK, lint, Firestore rules tests
#   merge to main        -> + deploy Firestore rules and indexes to Firebase
#   tag vX.Y.Z on main   -> + build a signed release APK and publish a GitHub Release
on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# Least privilege: jobs only read the repo unless they say otherwise
permissions:
  contents: read

# Cancel an older run on the same branch when a newer push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Unit tests & debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Caches Gradle dependencies and validates gradle-wrapper.jar
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Reports issues without failing the build (for now)
      - name: Run Android lint
        run: ./gradlew lintDebug
        continue-on-error: true

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: catheaven-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  firestore-rules-tests:
    name: Firestore security rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend-firebase

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # firebase-admin 14 requires Node 22+
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend-firebase/package-lock.json

      # The Firestore emulator runs on Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Starts the Firestore emulator, runs the tests, then shuts it down
      - name: Run rules tests against the emulator
        run: firebase emulators:exec --only firestore --project catheaven-dev "node rules.test.js"

  # Continuous deployment of the backend: only after both test jobs pass, and only from main
  deploy-firestore:
    name: Deploy Firestore rules & indexes
    needs: [ build-and-test, firestore-rules-tests ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    defaults:
      run:
        working-directory: backend-firebase

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # The service account key lives only in the FIREBASE_SERVICE_ACCOUNT secret
      - name: Authenticate with a service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT secret (see docs/DEPLOYMENT.md)"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"

      - name: Deploy rules and indexes
        run: firebase deploy --only firestore:rules,firestore:indexes --project catheaven-dev --non-interactive

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"

  # Publishes an installable APK whenever a version tag (e.g. v1.1.0) is pushed
  release-apk:
    name: Signed release APK & GitHub Release
    needs: [ build-and-test, firestore-rules-tests ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write   # needed to create the GitHub Release

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The keystore is stored base64-encoded in a secret and only exists for this job
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CATHEAVEN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the CATHEAVEN_KEYSTORE_* secrets (see docs/DEPLOYMENT.md)"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "CATHEAVEN_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          CATHEAVEN_KEYSTORE_PASSWORD: ${{ secrets.CATHEAVEN_KEYSTORE_PASSWORD }}
          CATHEAVEN_KEY_ALIAS: ${{ secrets.CATHEAVEN_KEY_ALIAS }}
          CATHEAVEN_KEY_PASSWORD: ${{ secrets.CATHEAVEN_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          ./gradlew assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/CatHeaven-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/CatHeaven-${GITHUB_REF_NAME}.apk" \
            --title "Cat Heaven $GITHUB_REF_NAME" \
            --generate-notes

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
